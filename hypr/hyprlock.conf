general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Imagens/maos.png
    color = rgb(18,12,32)
    blur_passes = 0
}

# Hora
label {
    monitor =
    text = $TIME
    color = rgb(255,255,255)
    font_size = 90
    font_family = Iosevka Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = rgb(236,228,255)
    font_size = 20
    font_family = Iosevka Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Campo de senha
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(180,140,255)
    inner_color = rgb(35,26,54)
    font_color = rgb(255,255,255)
    check_color = rgb(180,140,255)
    fail_color = rgb(255,107,157)
    fade_on_empty = false
    rounding = 5
    font_family = Iosevka Nerd Font
    placeholder_text = <span foreground="##ece4ff">Senha...</span>
    fail_text = <i>$FAIL</i>
    position = 0, -40
    halign = center
    valign = center
}

background {
    monitor =
    path = ~/Imagens/heaven.png
    color = rgb(18,12,32)
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    contrast = 0.9
    noise = 0.01        
}
